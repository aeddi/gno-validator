name: gno-validator

services:
    gnokms:
        build:
            context: .
            target: gnokms
            args:
                GNO_VERSION: ${GNO_VERSION:-master}
                GNO_REPO: ${GNO_REPO:-gnolang/gno}
                GNO_COMMIT_HASH: ${GNO_COMMIT_HASH:-}
                BUILD_DATE: ${BUILD_DATE:-}
                DOCKERFILE_HASH: ${DOCKERFILE_HASH:-}
                ENTRYPOINT_HASH: ${ENTRYPOINT_HASH:-}
        image: gno-validator-gnokms
        environment:
            GNOKMS_PASSWORD: ${GNOKMS_PASSWORD}
        volumes:
            - ./gnokms-data:/gnokms-data
            - gnokms-sock:/sock
        restart: unless-stopped
        logging:
            driver: json-file
            options:
                max-size: '1g'
                max-file: '1'

    gnoland:
        build:
            context: .
            target: gnoland
            args:
                GNO_VERSION: ${GNO_VERSION:-master}
                GNO_REPO: ${GNO_REPO:-gnolang/gno}
                GNO_COMMIT_HASH: ${GNO_COMMIT_HASH:-}
                BUILD_DATE: ${BUILD_DATE:-}
                DOCKERFILE_HASH: ${DOCKERFILE_HASH:-}
                ENTRYPOINT_HASH: ${ENTRYPOINT_HASH:-}
        image: gno-validator-gnoland
        user: "${HOST_UID:-0}:${HOST_GID:-0}"
        environment:
            GNOLAND_EARLY_START: ${GNOLAND_EARLY_START}
            GNOLAND_NTP_UPDATE: ${GNOLAND_NTP_UPDATE:-1}
        command:
            - gnoland
            - start
            - --skip-genesis-sig-verification
            - -log-format
            - json
        volumes:
            - ./gnoland-data:/gnoland-data
            - ./genesis.json:/genesis.json:ro
            - ./config.overrides:/config.overrides:ro
            - gnokms-sock:/sock
        ports:
            - '${GNOLAND_RPC_LADDR:-0.0.0.0}:${GNOLAND_RPC_PORT:-26657}:26657'
            - '${GNOLAND_P2P_LADDR:-0.0.0.0}:${GNOLAND_P2P_PORT:-26656}:26656'
        depends_on:
            gnokms:
                condition: service_started
        cap_add:
            - SYS_TIME
        restart: on-failure
        logging:
            driver: json-file
            options:
                max-size: '1g'
                max-file: '${GNOLAND_LOG_SIZE:-3}'

volumes:
    gnokms-sock:
